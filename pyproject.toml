[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lava-lyra"
dynamic = ["version"]
description = "A modern Lavalink v4 wrapper supporting both py-cord and discord.py, based on Pomice"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "ParrotXray"},
]
keywords = ["discord", "lavalink", "py-cord", "music", "audio", "lavalink4", "voice", "streaming"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.13.0",
    "orjson>=3.8.0",
    "websockets>=10.0",
    "typing-extensions;python_version<'3.11'",
]

[project.optional-dependencies]
pycord = [
    "py-cord[voice]>=2.6.0",
]
discordpy = [
    "discord.py[voice]>=2.6.0",
]
docs = [
    "sphinx>=5.0.0",
    "furo>=2024.0.0",
    "myst-parser>=2.0.0",
]
dev = [
    "mypy>=0.991",
    "ruff>=0.16.1",
    "pre-commit>=2.20.0",
]
speed = [
    "aiohttp[speedups]",
    "aiodns",
    "orjson",
]

[project.urls]
Homepage = "https://github.com/ParrotXray/lava-lyra"
Repository = "https://github.com/ParrotXray/lava-lyra"
"Issue Tracker" = "https://github.com/ParrotXray/lava-lyra/issues"
Source = "https://github.com/ParrotXray/lava-lyra"
Changelog = "https://github.com/ParrotXray/lava-lyra/blob/main/CHANGELOG.md"
"Original Pomice" = "https://github.com/cloudwithax/pomice"

[tool.setuptools]
packages = {find = {where = ["."], include = ["lava_lyra*"]}}
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "lava_lyra.__version__"}

[tool.setuptools.package-data]
"lava_lyra" = ["py.typed"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
ignore = [
    "BLE001", # broad `except Exception`: intentional in resilience/fallback paths, most already log
    "S110",   # `except: pass`: only in build-time scripts (docs/conf.py) or best-effort cleanup
    "SIM102", # nested if: several cases are clearer un-merged, no functional benefit either way
]

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "aiohttp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "orjson.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "discord.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true
