name: Auto Format Code

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: auto-format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-ruff-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install ruff

    - name: Detect fork PR
      id: fork-check
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
          echo "is_fork=true" >> $GITHUB_OUTPUT
        else
          echo "is_fork=false" >> $GITHUB_OUTPUT
        fi

    - name: Run ruff check (fork PR, read-only)
      if: steps.fork-check.outputs.is_fork == 'true'
      run: ruff check .

    - name: Run ruff format check (fork PR, read-only)
      if: steps.fork-check.outputs.is_fork == 'true'
      run: ruff format --check .

    - name: Run ruff lint fixes
      if: steps.fork-check.outputs.is_fork == 'false'
      run: ruff check --fix .

    - name: Run ruff formatter
      if: steps.fork-check.outputs.is_fork == 'false'
      run: ruff format .

    - name: Check for changes
      id: verify-changed-files
      if: steps.fork-check.outputs.is_fork == 'false'
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Files were changed by formatting"
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No files were changed by formatting"
        fi

    - name: Commit changes
      if: steps.fork-check.outputs.is_fork == 'false' && steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git commit -m "Auto-format code with ruff"

    - name: Push changes
      if: steps.fork-check.outputs.is_fork == 'false' && steps.verify-changed-files.outputs.changed == 'true'
      uses: ad-m/github-push-action@v1.3.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.head_ref || github.ref_name }}

    - name: Comment on PR
      if: steps.fork-check.outputs.is_fork == 'false' && steps.verify-changed-files.outputs.changed == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'Code has been automatically formatted! All format checks passed. Please pull the latest changes.'
          })

    - name: Comment on PR if no changes
      if: steps.fork-check.outputs.is_fork == 'false' && steps.verify-changed-files.outputs.changed == 'false' && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'Code formatting check completed! No formatting changes needed. All format checks passed.'
          })
